# Every test in this module gets a hard deadline.
#
# The integration tests talk over real sockets, and MessageChannel.receive() is a
# blocking readLine() with no socket timeout. If the server ever fails to send a
# message a test is waiting for, that test would block forever rather than fail --
# the build would simply hang with no output pointing at the cause.
#
# 60s is far above the slowest test observed (~2s) so it never fires on a healthy
# run; it exists purely to turn a hang into a normal, diagnosable test failure.
junit.jupiter.execution.timeout.default = 60s
